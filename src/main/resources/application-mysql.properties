# Optional MySQL profile. Set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medicine_donation_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
